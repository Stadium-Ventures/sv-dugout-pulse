<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="dark">
<title>SV Dugout Pulse</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #22262f;
    --border: #2a2e3a;
    --text: #e4e4e7;
    --text-dim: #71717a;
    --accent-blue: #3b82f6;
    --accent-orange: #f59e0b;
    --grade-milestone: #a855f7;
    --grade-standout: #ef4444;
    --grade-good: #22c55e;
    --grade-routine: #6b7280;
    --grade-flag: #eab308;
    --grade-nodata: #3f3f46;
    --live-green: #22c55e;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1rem;
  }

  /* ---- Header ---- */
  .header {
    text-align: center;
    padding: 1.5rem 0 1rem;
  }
  .header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .header .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 0.25rem;
  }
  .next-update {
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 0.2rem;
  }
  .header-nav {
    margin-top: 0.6rem;
    display: flex;
    justify-content: center;
    gap: 0.6rem;
  }
  .header-nav a {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    text-decoration: none;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--card-border, #1f2735);
    border-radius: 999px;
    background: rgba(255,255,255,0.02);
    transition: color 0.15s, border-color 0.15s;
  }
  .header-nav a:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }

  /* ---- Filters ---- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    padding: 1rem 0;
    max-width: 900px;
    margin: 0 auto;
  }
  .filter-group {
    display: flex;
    gap: 0.25rem;
    background: var(--surface);
    border-radius: 8px;
    padding: 3px;
  }
  .filter-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { color: var(--text); background: var(--surface-hover); }
  .filter-btn.active { background: var(--border); color: var(--text); font-weight: 600; }
  .clear-filters-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .clear-filters-btn:hover { color: var(--text); border-color: var(--text-dim); }

  /* ---- Loading ---- */
  .loading-splash {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 1rem;
    gap: 1rem;
  }
  .loading-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  /* ---- Grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 0.75rem;
    max-width: 1200px;
    margin: 1rem auto;
  }

  /* ---- Card ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    transition: border-color 0.15s, opacity 0.25s ease, transform 0.25s ease;
    position: relative;
    contain: layout style paint;
    animation: cardFadeIn 0.25s ease;
  }
  @keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:hover { border-color: #3a3e4a; }

  /* ---- Grade-tinted card backgrounds ---- */
  .card.grade-tint-milestone {
    background: linear-gradient(135deg, rgba(168,85,247,0.08) 0%, var(--surface) 60%);
    border-color: rgba(168,85,247,0.25);
  }
  .card.grade-tint-standout {
    background: linear-gradient(135deg, rgba(239,68,68,0.07) 0%, var(--surface) 60%);
    border-color: rgba(239,68,68,0.2);
  }
  .card.grade-tint-good {
    background: linear-gradient(135deg, rgba(34,197,94,0.06) 0%, var(--surface) 60%);
    border-color: rgba(34,197,94,0.18);
  }
  .card.grade-tint-flag {
    background: linear-gradient(135deg, rgba(234,179,8,0.06) 0%, var(--surface) 60%);
    border-color: rgba(234,179,8,0.18);
  }

  /* ---- Level accent (left border) ---- */
  .card.level-pro, .window-card.level-pro { border-left: 3px solid var(--accent-blue); }
  .card.level-ncaa, .window-card.level-ncaa { border-left: 3px solid var(--accent-orange); }
  .card.level-summer, .window-card.level-summer { border-left: 3px solid #c084fc; }

  /* Status-only Summer cards (Shut Down, Injured, Pending) — show in muted
     style so they're clearly differentiated from cards with live game data. */
  .card.summer-inactive {
    opacity: 0.55;
    border-left-color: #71717a;
  }
  .card.summer-inactive:hover { opacity: 0.85; }
  .card.summer-inactive .game-info { display: none; }
  .card.summer-inactive .stats { color: var(--text-dim); font-style: italic; font-size: 0.85rem; }
  .summer-status-pill {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    background: rgba(113,113,122,0.2);
    color: #a1a1aa;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-left: 0.4rem;
  }
  .summer-status-pill.injured { background: rgba(234,179,8,0.2); color: #facc15; }
  .summer-status-pill.shutdown { background: rgba(239,68,68,0.18); color: #f87171; }
  .summer-status-pill.pending { background: rgba(59,130,246,0.15); color: #93c5fd; }

  /* ---- Live card glow (overrides level border) ---- */
  .card.live { border-left: 3px solid var(--live-green); animation: live-glow 2.5s ease-in-out infinite; }
  @keyframes live-glow {
    0%, 100% { box-shadow: 0 0 4px rgba(34,197,94,0.15); }
    50% { box-shadow: 0 0 12px rgba(34,197,94,0.3), 0 0 4px rgba(34,197,94,0.15); }
  }

  /* ---- Elevated stats for top performances ---- */
  .stats-elevated {
    font-size: 1.35rem !important;
    font-weight: 700 !important;
  }

  /* ---- De-emphasized tier badge ---- */
  .badge-tier-dim {
    font-size: 0.55rem;
    opacity: 0.5;
    background: rgba(107,114,128,0.12);
    color: #9ca3af;
  }

  /* ---- Larger grade bar ---- */
  .grade-bar {
    font-size: 0.9rem;
    font-weight: 700;
    padding: 0.35rem 0.7rem;
  }

  .card-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;           /* badges flow to a 2nd line instead of squeezing the name */
    gap: 0.35rem 0.5rem;
    margin-bottom: 0.6rem;
  }
  .player-name {
    font-size: 1.05rem;
    font-weight: 700;
    flex: 1 1 auto;
    min-width: 0;
    white-space: normal;       /* never truncate — full name always shows */
    line-height: 1.2;
  }
  a.player-name {
    color: inherit;
    text-decoration: none;
  }
  a.player-name:hover {
    text-decoration: underline;
  }
  .live-dot {
    width: 8px; height: 8px;
    background: var(--live-green);
    border-radius: 50%;
    animation: pulse-dot 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
    50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(34,197,94,0); }
  }

  .badge {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .badge-pro { background: rgba(59,130,246,0.2); color: var(--accent-blue); }
  .badge-ncaa { background: rgba(245,158,11,0.2); color: var(--accent-orange); }
  .badge-hs { background: rgba(16,185,129,0.2); color: #10b981; }
  .badge-summer { background: rgba(168,85,247,0.2); color: #c084fc; }
  .badge-t1 { background: rgba(168,85,247,0.15); color: #c084fc; }
  .badge-t2 { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .badge-t3 { background: rgba(107,114,128,0.2); color: #9ca3af; }
  .badge-t4 { background: rgba(63,63,70,0.3); color: #71717a; }
  .badge-following { background: rgba(107,114,128,0.2); color: #9ca3af; }
  .badge-client { background: rgba(34,197,94,0.15); color: #86efac; }

  /* ---- Heartbeat status heart ---- */
  .heartbeat-link { text-decoration: none; flex-shrink: 0; }
  .heartbeat-icon {
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .heartbeat-icon:hover { transform: scale(1.2); }
  .heartbeat-red    { color: #ef4444; animation: heart-pulse 2s ease-in-out infinite; }
  .heartbeat-yellow { color: #eab308; }
  .heartbeat-green  { color: #22c55e; }
  .heartbeat-gray   { color: #6b7280; }
  @keyframes heart-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  .team-name {
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-bottom: 0.6rem;
  }

  .grade-bar {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border-radius: 6px;
    margin-bottom: 0.6rem;
  }
  .grade-milestone { background: rgba(168,85,247,0.15); color: #c084fc; }
  .grade-standout { background: rgba(239,68,68,0.15); color: #fca5a5; }
  .grade-good { background: rgba(34,197,94,0.15); color: #86efac; }
  .grade-routine { background: rgba(107,114,128,0.15); color: #9ca3af; }
  .grade-flag { background: rgba(234,179,8,0.15); color: #fde047; }
  .grade-scheduled { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .grade-nodata { background: rgba(63,63,70,0.2); color: #71717a; }
  .grade-unavailable { background: rgba(234,179,8,0.12); color: #fbbf24; border: 1px solid rgba(234,179,8,0.3); }

  .grade-reason {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
    font-style: italic;
  }

  .stats-line {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
    font-variant-numeric: tabular-nums;
  }
  .game-context {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }
  a.game-context {
    text-decoration: none;
    display: block;
    transition: color 0.15s;
    cursor: pointer;
  }
  a.game-context:hover {
    color: var(--accent-blue);
    text-decoration: underline;
  }

  .game-date-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 0.25rem;
  }

  .game-time {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }
  .game-time .time-value {
    color: var(--accent-blue);
    font-weight: 600;
  }

  .next-game {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 0.75rem;
    padding: 0.4rem 0.6rem;
    background: rgba(59,130,246,0.08);
    border-radius: 6px;
    border-left: 2px solid var(--accent-blue);
  }
  .next-game .next-label {
    color: var(--text-dim);
    font-weight: 500;
  }
  .next-game .next-value {
    color: var(--text);
  }

  .card-tags {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }
  .tag {
    font-size: 0.65rem;
    color: var(--text-dim);
    background: rgba(255,255,255,0.05);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
  }

  .card-actions {
    display: flex;
    gap: 0.5rem;
  }
  .btn {
    flex: 1;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    text-decoration: none;
  }
  .btn:hover { background: var(--surface-hover); border-color: #4a4e5a; }


  /* (stale banner removed — pipeline runs on schedule) */

  /* ---- Auto-refresh indicator ---- */
  .auto-refresh-indicator {
    display: none;
    align-items: center;
    gap: 0.4rem;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--live-green);
    margin-top: 0.25rem;
  }
  .auto-refresh-indicator.active { display: flex; }
  .auto-refresh-dot {
    width: 6px; height: 6px;
    background: var(--live-green);
    border-radius: 50%;
    animation: pulse-dot 1.5s infinite;
  }

  /* ---- Yesterday badge ---- */
  .badge-yesterday { background: rgba(245,158,11,0.2); color: var(--accent-orange); }

  /* ---- Doubleheader game number badge ---- */
  .badge-gm { background: var(--accent-blue); color: #fff; }

  /* ---- Stale data banner ---- */
  .stale-banner {
    display: none;
    max-width: 1200px;
    margin: 0.75rem auto 0;
    padding: 0.5rem 0.85rem;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 8px;
    color: var(--accent-orange);
    font-size: 0.82rem;
    text-align: center;
  }

  /* ---- Collapsed no-game section ---- */
  .no-game-section {
    max-width: 1200px;
    margin: 1.5rem auto 0;
  }
  .no-game-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    padding: 0.6rem 0.8rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 600;
    user-select: none;
  }
  .no-game-header:hover { color: var(--text); border-color: #3a3e4a; }
  .no-game-chevron {
    transition: transform 0.2s;
    font-size: 0.7rem;
  }
  .no-game-header.open .no-game-chevron { transform: rotate(90deg); }
  .no-game-list {
    display: none;
    padding: 0.5rem 0;
  }
  .no-game-list.open { display: block; }
  .no-game-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.4rem 0.8rem;
    font-size: 0.8rem;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(42,46,58,0.5);
  }
  .no-game-row:last-child { border-bottom: none; }
  .no-game-name {
    font-weight: 600;
    color: var(--text);
    min-width: 140px;
  }
  .no-game-team {
    min-width: 100px;
  }
  .no-game-next {
    flex: 1;
    text-align: right;
    font-size: 0.75rem;
  }

  /* ---- Skeleton loading cards ---- */
  .skeleton-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    overflow: hidden;
  }
  .skeleton-bar {
    background: var(--border);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .skeleton-bar::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .skeleton-name {
    height: 1rem;
    width: 60%;
    margin-bottom: 0.5rem;
  }
  .skeleton-team {
    height: 0.75rem;
    width: 35%;
    margin-bottom: 0.6rem;
  }
  .skeleton-stat {
    height: 0.8rem;
    width: 45%;
    margin-bottom: 0.4rem;
  }
  .skeleton-stat-short {
    height: 0.8rem;
    width: 30%;
    margin-bottom: 0.4rem;
  }
  .skeleton-stat-wide {
    height: 0.8rem;
    width: 70%;
  }

  /* ---- Empty state ---- */
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 4rem 1rem;
    font-size: 0.95rem;
  }

  /* ---- Time Window Tabs (iOS segmented control) ---- */
  .time-tabs {
    display: flex;
    justify-content: center;
    gap: 0;
    padding: 0.75rem 0;
    max-width: 480px;
    margin: 0 auto;
  }
  .time-tab {
    flex: 1;
    white-space: nowrap;
    padding: 0.55rem 0.6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .time-tab:first-child { border-radius: 8px 0 0 8px; }
  .time-tab:last-child { border-radius: 0 8px 8px 0; }
  .time-tab:not(:last-child) { border-right: none; }
  .time-tab.active {
    background: var(--accent-blue);
    color: white;
    border-color: var(--accent-blue);
  }
  .time-tab:hover:not(.active) {
    background: var(--surface-hover);
    color: var(--text);
  }

  /* ---- Window Stats Card ---- */
  .window-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    transition: border-color 0.15s;
    contain: layout style paint;
  }
  .window-card:hover { border-color: #3a3e4a; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    text-align: center;
    margin-top: 0.75rem;
  }
  .stat-row.pitcher-row { grid-template-columns: repeat(5, 1fr); }
  .stat-row.hitter-row  { grid-template-columns: repeat(6, 1fr); }

  .stat-cell {
    display: flex;
    flex-direction: column;
  }
  .stat-label {
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.15rem;
  }
  .stat-value {
    font-size: 1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.sparse { color: var(--text-dim); }
  .stat-value.rate-hot { color: #4ade80; }
  .stat-value.rate-warm { color: #86efac; }
  .stat-value.rate-cold { color: #fca5a5; }
  .stat-value.rate-ice { color: #f87171; }

  /* Window grades */
  .window-grade {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .grade-hot { background: rgba(239,68,68,0.15); color: #fca5a5; }
  .grade-solid { background: rgba(34,197,94,0.15); color: #86efac; }
  .grade-quiet { background: rgba(107,114,128,0.15); color: #9ca3af; }
  .grade-cold { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .grade-insufficient { background: rgba(63,63,70,0.2); color: #71717a; }

  .games-played {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 0.5rem;
  }

  /* ---- Game Log Drill-Down ---- */
  .game-log-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    padding: 0.5rem 0 0.3rem;
    margin-top: 0.5rem;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.78rem;
    font-weight: 600;
    user-select: none;
  }
  .game-log-toggle:hover { color: var(--text); }
  .game-log-chevron {
    transition: transform 0.2s;
    font-size: 0.65rem;
  }
  .game-log-toggle.open .game-log-chevron { transform: rotate(90deg); }
  .game-log-entries {
    display: none;
    padding: 0.25rem 0 0;
  }
  .game-log-entries.open { display: block; }
  .game-log-row {
    display: grid;
    grid-template-columns: 3.2rem 1fr;
    gap: 0.4rem;
    padding: 0.25rem 0;
    font-size: 0.75rem;
    border-bottom: 1px solid rgba(42,46,58,0.4);
  }
  .game-log-row:last-child { border-bottom: none; }
  .game-log-date {
    color: var(--text-dim);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .game-log-opp {
    color: var(--text-dim);
    font-size: 0.7rem;
  }
  .game-log-stats {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  a.game-log-link {
    text-decoration: none;
    color: inherit;
    border-radius: 4px;
    transition: background 0.15s;
  }
  a.game-log-link:hover { background: var(--surface-hover); }

  /* ---- Search bar ---- */
  .search-wrap {
    max-width: 400px;
    margin: 0 auto;
    padding: 0 0 0.5rem;
  }
  .search-input {
    width: 100%;
    padding: 0.5rem 0.75rem 0.5rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: var(--accent-blue); }
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute;
    left: 0.6rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 0.85rem;
    pointer-events: none;
  }

  /* ---- Data source label ---- */
  .data-source {
    font-size: 0.7rem;
    color: var(--text-dim);
    opacity: 0.6;
    margin-top: 0.15rem;
  }
  /* ---- Run health banner ---- */
  .health-banner {
    margin: 0 auto 1rem auto;
    max-width: 1200px;
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.4;
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
  }
  .health-banner.warning {
    background: rgba(251, 191, 36, 0.10);
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #fde68a;
  }
  .health-banner.critical {
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.45);
    color: #fecaca;
  }
  .health-banner.ok {
    background: rgba(52, 211, 153, 0.08);
    border: 1px solid rgba(52, 211, 153, 0.30);
    color: #86efac;
    padding: 0.4rem 0.75rem;
  }
  .health-banner.ok .health-banner-title { font-weight: 500; font-size: 0.78rem; margin: 0; }
  .health-banner.ok .health-banner-icon { font-size: 0.85rem; }
  .health-banner.recovery {
    background: rgba(96, 165, 250, 0.10);
    border: 1px solid rgba(96, 165, 250, 0.35);
    color: #bfdbfe;
  }
  .health-banner.info {
    background: rgba(96, 165, 250, 0.08);
    border: 1px solid rgba(96, 165, 250, 0.25);
    color: #bfdbfe;
  }
  .health-banner-icon { font-size: 1.05rem; line-height: 1; }
  .health-banner-body { flex: 1; }
  .health-banner-title { font-weight: 600; margin-bottom: 0.15rem; }
  .health-banner-detail { opacity: 0.9; font-size: 0.78rem; }
  .health-banner a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  /* ---- Stale-stats "as of" indicator ---- */
  .stats-asof {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 600;
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.35);
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 0.4rem;
    vertical-align: middle;
    letter-spacing: 0.02em;
  }
  /* ---- Plain-English card status line (replaces old "Fetch trace") ---- */
  .card-status {
    display: flex;
    align-items: flex-start;
    gap: 0.4rem;
    margin-top: 0.3rem;
    padding: 0.35rem 0.5rem;
    border-radius: 6px;
    font-size: 0.72rem;
    line-height: 1.3;
    cursor: help;
  }
  .card-status-icon { flex-shrink: 0; font-size: 0.85rem; line-height: 1; margin-top: 0.05rem; }
  .card-status-blocked {
    color: #f87171;
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid rgba(248, 113, 113, 0.25);
  }
  .card-status-info {
    color: var(--text-dim);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* ---- XBH highlights in stats line ---- */
  .stat-highlight-hr {
    color: #fbbf24;
    font-weight: 700;
  }
  .stat-highlight-xbh {
    color: #a78bfa;
    font-weight: 700;
  }
  .stat-highlight-rbi {
    color: #f97316;
    font-weight: 700;
  }
  .stat-highlight-sb {
    color: #06b6d4;
    font-weight: 700;
  }
  .stat-highlight-bb {
    color: #34d399;
    font-weight: 600;
  }
  .stat-highlight-k {
    color: #ef4444;
    font-weight: 600;
  }

  /* ---- Pull-to-refresh ---- */
  .pull-refresh {
    text-align: center;
    font-size: 0.8rem;
    color: var(--accent-blue);
    height: 0;
    overflow: hidden;
    transition: height 0.3s ease, opacity 0.3s ease;
    opacity: 0;
    line-height: 2.5rem;
  }
  .pull-refresh.active {
    height: 2.5rem;
    opacity: 1;
  }

  /* ---- Status section headers ---- */
  .status-section-header {
    grid-column: 1 / -1;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9ca3af;
    padding: 0.75rem 0 0.25rem;
    border-bottom: 1px solid rgba(156,163,175,0.2);
    margin-bottom: 0.25rem;
  }

  /* ---- Responsive ---- */
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .filters { overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; padding: 0.75rem 0; position: relative; }
    .filters::after {
      content: '';
      position: sticky;
      right: 0;
      top: 0;
      flex-shrink: 0;
      width: 2rem;
      height: 100%;
      background: linear-gradient(to right, transparent, var(--bg));
      pointer-events: none;
    }
    .filter-group { flex-shrink: 0; }
    body { padding: 0.5rem; }
    .header h1 { font-size: 1.4rem; }
    /* Six time tabs on a phone: keep one row, allow a sideways scroll if the
       screen is truly tiny, and drop the padding so labels stay readable. */
    .time-tabs { max-width: 100%; overflow-x: auto; padding: 0.6rem 0.25rem; }
    .time-tab { padding: 0.5rem 0.45rem; font-size: 0.74rem; }
    /* Stat grids: numbers are short — keep the columns, shrink the type. */
    .stat-row .stat-value, .window-card .stat-value { font-size: 0.92rem; }
    .stat-row .stat-label, .window-card .stat-label { font-size: 0.6rem; }
    .summer-banner, .change-strip { margin-left: 0; margin-right: 0; }
    .card-actions .btn { padding: 0.5rem 0.6rem; font-size: 0.78rem; }
    .level-breakdown .lvl-line { font-size: 0.74rem; }
  }

  /* Summer Ball coverage banner — compact, collapsed by default */
  .summer-banner {
    max-width: 600px;
    margin: 8px auto 12px;
    padding: 6px 12px;
    background: rgba(26,122,48,0.05);
    border: 1px solid rgba(26,122,48,0.25);
    border-left: 3px solid #1a7a30;
    border-radius: 6px;
    font-size: 0.78rem;
    line-height: 1.4;
    color: var(--text-dim);
  }
  .summer-banner .summer-head {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .summer-banner .summer-title {
    font-weight: 600; font-size: 0.78rem; color: var(--text);
  }
  .summer-banner .summer-stat { color: var(--text-dim); font-size: 0.75rem; }
  .summer-banner .summer-stat strong { color: var(--text); }
  .summer-banner .summer-toggle {
    margin-left: auto; color: var(--text-dim); font-size: 0.72rem;
  }
  /* Chips + details hidden by default; only revealed when banner expanded. */
  .summer-banner .summer-chips { margin-top: 8px; display: none; }
  .summer-banner.expanded .summer-chips { display: block; }
  .summer-chip {
    display: inline-block; margin: 2px 4px 2px 0; padding: 3px 8px;
    border-radius: 999px; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .summer-chip-ok { background: #1a7a3020; color: #1a7a30; }
  .summer-chip-failed { background: #d32f2f20; color: #d32f2f; }
  .summer-chip-stub { background: #9e9e9e20; color: #6e7781; }
  .summer-banner .summer-detail { display: none; margin-top: 12px; }
  .summer-banner.expanded .summer-detail { display: block; }
  .summer-banner.expanded .summer-toggle::after { content: ' ▲'; }
  .summer-banner:not(.expanded) .summer-toggle::after { content: ' ▼'; }
  .summer-list { margin: 6px 0 0 0; padding-left: 18px; font-size: 0.85rem; }
  .summer-list li { padding: 3px 0; }
  .summer-list .college { color: #57606a; }
  .summer-list .meta { color: #57606a; font-size: 0.8rem; }
  .summer-section-title {
    font-weight: 700; font-size: 0.8rem; color: #424a53;
    text-transform: uppercase; letter-spacing: 0.05em; margin-top: 10px;
  }
  /* "Live now" pill — appears in the header only when games are in progress. */
  .live-pill {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 8px auto 0; padding: 4px 12px;
    background: rgba(239,68,68,0.12); color: #ef4444;
    border: 1px solid rgba(239,68,68,0.4); border-radius: 999px;
    font-size: 0.78rem; font-weight: 700; cursor: pointer;
    font-family: inherit; animation: livePulse 2s ease-in-out infinite;
  }
  .live-pill:hover { background: rgba(239,68,68,0.2); }
  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
  /* Recent-form momentum chip (Pro: last 7D vs last 30D). */
  .momentum-chip {
    display: inline-block; margin-left: 6px; padding: 1px 7px;
    border-radius: 999px; font-size: 0.68rem; font-weight: 700;
    vertical-align: middle; letter-spacing: 0.02em;
  }
  .momentum-hot  { background: rgba(251,140,0,0.15);  color: #fb8c00; }
  .momentum-cold { background: rgba(59,130,246,0.15); color: #5b9bf3; }
  /* Data-confidence dot — only rendered when there's a caveat (no dot = clean). */
  .conf-dot {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block;
    margin-right: 5px; vertical-align: middle; flex: none;
  }
  .conf-red    { background: #ef4444; box-shadow: 0 0 0 2px rgba(239,68,68,0.2); }
  .conf-yellow { background: #eab308; box-shadow: 0 0 0 2px rgba(234,179,8,0.2); }
  /* "Since yesterday" change strip — call-ups / team moves / standout games. */
  .change-strip {
    max-width: 600px; margin: 8px auto 12px; padding: 8px 12px;
    background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.25);
    border-left: 3px solid #3b82f6; border-radius: 6px;
    font-size: 0.78rem; line-height: 1.5; color: var(--text-dim);
  }
  .change-strip .cs-head {
    display: flex; align-items: center; font-weight: 700;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: #5b9bf3; margin-bottom: 4px;
  }
  .change-strip .cs-dismiss {
    margin-left: auto; cursor: pointer; color: var(--text-dim);
    font-size: 0.9rem; padding: 0 4px; user-select: none;
  }
  .change-strip .cs-row { padding: 1px 0; }
  .change-strip .cs-row strong { color: var(--text); }
  /* Season per-level breakdown (multi-level players). */
  .level-breakdown { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .level-breakdown-head {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 5px;
  }
  .lvl-row {
    display: flex; align-items: baseline; gap: 8px; font-size: 0.8rem;
    padding: 2px 0; color: var(--text);
  }
  .lvl-tag {
    flex: none; min-width: 34px; font-weight: 700; font-size: 0.7rem;
    color: #5b9bf3;
  }
  .lvl-line { flex: 1; color: var(--text-dim); }
  .lvl-now {
    flex: none; font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: #4ade80; background: rgba(34,197,94,0.15);
    padding: 1px 5px; border-radius: 4px;
  }
  .lvl-g { flex: none; color: var(--text-dim); font-size: 0.72rem; }
</style>
</head>
<body>

<div class="pull-refresh" id="pullRefresh">Refreshing...</div>

<div class="header">
  <h1>SV Dugout Pulse</h1>
  <div class="subtitle" id="updated"></div>
  <div class="next-update" id="nextUpdate"></div>
  <div id="bbrefFreshness" style="font-size:0.72rem; color:var(--text-dim); margin-top:0.2rem;"></div>
  <div class="auto-refresh-indicator" id="autoRefreshIndicator">
    <div class="auto-refresh-dot"></div>
    <span>Auto-refreshing</span>
  </div>
  <button class="live-pill" id="livePill" type="button" style="display:none" title="Show only players in live games right now"></button>
  <nav class="header-nav" aria-label="Secondary">
    <a href="diagnostics.html">📊 Source health &amp; coverage</a>
  </nav>
</div>
<div class="stale-banner" id="staleBanner"></div>
<div class="summer-banner" id="summerBanner" hidden></div>
<div class="change-strip" id="changeStrip" hidden></div>
<div class="time-tabs" role="tablist" aria-label="Time window">
  <button class="time-tab active" data-window="today" role="tab" aria-selected="true">Today</button>
  <button class="time-tab" data-window="yesterday" role="tab" aria-selected="false">Yesterday</button>
  <button class="time-tab" data-window="7d" role="tab" aria-selected="false">7D</button>
  <button class="time-tab" data-window="14d" role="tab" aria-selected="false">14D</button>
  <button class="time-tab" data-window="30d" role="tab" aria-selected="false">30D</button>
  <button class="time-tab" data-window="season" role="tab" aria-selected="false">Season</button>
</div>

<div class="search-wrap" role="search">
  <span class="search-icon" aria-hidden="true">&#x1F50D;</span>
  <input type="text" class="search-input" id="searchInput" placeholder="Search players..." autocomplete="off" aria-label="Search players">
</div>

<div class="filters">
  <div class="filter-group" data-filter="roster">
    <button class="filter-btn" data-value="all">All</button>
    <button class="filter-btn active" data-value="client">Clients</button>
    <button class="filter-btn" data-value="following">Recruits</button>
  </div>
  <div class="filter-group" data-filter="level">
    <button class="filter-btn active" data-value="all">All</button>
    <button class="filter-btn" data-value="Pro">Pro</button>
    <button class="filter-btn" data-value="NCAA">NCAA</button>
    <button class="filter-btn" data-value="HS">HS</button>
    <button class="filter-btn filter-btn-summer" data-value="Summer">☀️ Summer Ball</button>
  </div>
  <div class="filter-group" data-filter="position">
    <button class="filter-btn active" data-value="all">All</button>
    <button class="filter-btn" data-value="Hitter">Hitters</button>
    <button class="filter-btn" data-value="Pitcher">Pitchers</button>
  </div>
  <div class="filter-group" data-filter="status">
    <button class="filter-btn active" data-value="all">All</button>
    <button class="filter-btn" data-value="Live">Live</button>
    <button class="filter-btn" data-value="Final">Final</button>
    <button class="filter-btn" data-value="Cancelled">Postponed</button>
  </div>
  <div class="filter-group" data-filter="heartbeat">
    <button class="filter-btn active" data-value="all">&#x2665; All</button>
    <button class="filter-btn" data-value="red" style="color:#ef4444">&#x2665;</button>
    <button class="filter-btn" data-value="yellow" style="color:#eab308">&#x2665;</button>
    <button class="filter-btn" data-value="green" style="color:#22c55e">&#x2665;</button>
  </div>
  <div class="filter-group" data-filter="grade">
    <button class="filter-btn active" data-value="all">All</button>
    <button class="filter-btn" data-value="Milestone" title="Milestone: Debut or historic achievement">&#x1f48e;</button>
    <button class="filter-btn" data-value="Standout" title="Standout: HR, 3+ hits, 3+ RBI, or dominant pitching">&#x1f525;</button>
    <button class="filter-btn" data-value="Good" title="Good: 2+ hits, XBH, steal, or clean pitching outing">&#x2705;</button>
    <button class="filter-btn" data-value="Routine" title="Routine: Normal game — nothing stood out">&#x1f610;</button>
    <button class="filter-btn" data-value="Off Day" title="Off Day: Hitless in 4+ AB, 3+ Ks, or rough pitching">&#x1f6a9;</button>
    <button class="filter-btn" data-value="Scheduled" title="Scheduled: Game hasn't started yet">&#x1f552;</button>
  </div>
  <button class="clear-filters-btn" id="clearFiltersBtn" title="Reset all filters" style="display:none;">Clear filters</button>
</div>

<div id="healthBanner" style="display:none;"></div>

<div class="grid" id="grid">
  <div class="loading-splash" id="loadingSplash">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading player data...</div>
  </div>
</div>
<div class="no-game-section" id="noGameSection" style="display:none;">
  <div class="no-game-header" id="noGameHeader" onclick="toggleNoGame()" role="button" aria-expanded="false">
    <span class="no-game-chevron" aria-hidden="true">&#x25B6;</span>
    <span id="noGameLabel">No game today</span>
  </div>
  <div class="no-game-list" id="noGameList"></div>
</div>
<div class="empty" id="empty" style="display:none;">No players match the current filters.</div>

<script src="js/app.js?v=2026-07-07"></script>
</body>
</html>
