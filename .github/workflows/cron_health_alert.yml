name: Daily Health Check

# Daily self-health-check → #sv-automation. Silent when healthy.
# Runs at 22:00 UTC = 6 PM ET — after the BBRef windows (9 AM / 12 PM /
# 5 PM ET) and mid live-pulse hours, so every data product should be fresh.
# Checks freshness of: current_pulse.json, bbref_stats.json,
# summer_ball_rosters.json (see scripts/cron_health_alert.py).
#
# Manual test: run via workflow_dispatch with test=true to send a clearly
# labeled test post through the real code path.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a labeled test post to #sv-automation (ignores health)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install --quiet requests
      - name: Run health check
        env:
          SV_AUTOMATION_WEBHOOK_URL: ${{ secrets.SV_AUTOMATION_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python -m scripts.cron_health_alert --test
          else
            python -m scripts.cron_health_alert
          fi
