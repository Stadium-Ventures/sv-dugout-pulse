name: SV Way sync

# One weekly job, identical in every Stadium Ventures repo (BE 2026-10-26, "fix sv
# automation durably"). Plain GitHub Actions plus public HTTP GETs; no LLM, no API cost.
#
# 1. Pull the shared tools. scripts/compliance/sync-sv-way-block.cjs and
#    sv-way-config-staleness.cjs live in ONE place, Stadium-Ventures/sv-registry, and
#    the hub serves them at https://sv-internal-hub.vercel.app/tools/<file>. Every
#    other repo refreshes its copy here on each run, so the copies cannot fall behind
#    canon again (they had: old copies counted bot commits as drift). If the hub is
#    unreachable the repo keeps the copy it has.
# 2. Sync the doctrine block in CLAUDE.md (verbatim, zero judgment).
# 3. Record the sv-way.config.json staleness verdict in sv-way.staleness.json. Only
#    structural change counts (files added, deleted or renamed in a tree the config
#    makes a role claim about). The SV Internal Hub's Monday hygiene digest reads
#    that file from every repo and lists a stale config there. A stale config is
#    housekeeping, not a break, so it is never posted to #sv-automation.
# 4. Commit whatever changed, as a bot commit (never counted as drift).
#
# #sv-automation hears from this job only if the job itself fails.

on:
  schedule:
    - cron: "0 13 * * 1" # Monday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the staleness check diffs commits since the config's last human review

      - name: Pull the shared tools from canon
        if: github.repository != 'Stadium-Ventures/sv-registry'
        run: |
          mkdir -p scripts/compliance
          for f in sync-sv-way-block.cjs sv-way-config-staleness.cjs; do
            if curl -fsS --max-time 20 "https://sv-internal-hub.vercel.app/tools/$f" -o "$RUNNER_TEMP/$f" \
               && [ -s "$RUNNER_TEMP/$f" ] && node --check "$RUNNER_TEMP/$f"; then
              cp "$RUNNER_TEMP/$f" "scripts/compliance/$f"
            else
              echo "::warning::could not fetch $f from the hub; keeping this repo's copy"
            fi
          done

      - name: Sync the doctrine block
        run: |
          if [ -f scripts/compliance/sync-sv-way-block.cjs ] && [ -f CLAUDE.md ]; then
            node scripts/compliance/sync-sv-way-block.cjs
          fi

      - name: Record sv-way.config.json staleness
        run: |
          if [ -f scripts/compliance/sv-way-config-staleness.cjs ]; then
            node scripts/compliance/sv-way-config-staleness.cjs --write
          fi

      - name: Commit if anything changed
        run: |
          for p in CLAUDE.md scripts/compliance/sync-sv-way-block.cjs scripts/compliance/sv-way-config-staleness.cjs sv-way.staleness.json; do
            [ -e "$p" ] && git add -- "$p"
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "sv-way-sync[bot]"
          git config user.email "actions@github.com"
          git commit -m "[bot] SV Way sync: doctrine block, shared tools, config staleness [skip ci] [vercel skip]"
          git push

      - name: Tell #sv-automation the sync itself failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SV_AUTOMATION_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "::error::SV_AUTOMATION_WEBHOOK_URL is not set"; exit 1; }
          NAME="${REPO#*/}"
          TEXT=$(printf '🛠️ *%s (%s) — the weekly SV Way sync failed*\n*What broke:* the job that syncs the doctrine block and records sv-way.config.json staleness did not finish.\n*How we know:* the SV Way sync workflow failed on its Monday run.\n*What to do:* open the run log and fix the failing step: %s' "$NAME" "$NAME" "$RUN_URL")
          jq -n --arg t "$TEXT" '{text:$t}' | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
